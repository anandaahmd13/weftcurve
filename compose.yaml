services:
  postgres:
    image: postgres:18
    ports:
      - '127.0.0.1:55432:5432'
    environment:
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: weft-local-only
      POSTGRES_DB: weftcurve_simulator
    volumes:
      - weft-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weft -d weftcurve_simulator']
      interval: 5s
      retries: 10
volumes:
  weft-db:
